name: Build
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure private Go modules
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${RELEASES_TOKEN}@github.com/GoCodeAlone/".insteadOf "https://github.com/GoCodeAlone/"
          go env -w GOPRIVATE=github.com/GoCodeAlone/*
          go env -w GONOSUMDB=github.com/GoCodeAlone/*
      - name: Install wfctl v0.78.2
        run: |
          curl -fsSL -o wfctl https://github.com/GoCodeAlone/workflow/releases/download/v0.78.2/wfctl-linux-amd64
          chmod +x wfctl
          sudo mv wfctl /usr/local/bin/wfctl
      - name: Test
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: GOWORK=off go test -timeout 2m ./...
      - name: Checkout workflow-compute for provider alignment
        uses: actions/checkout@v4
        with:
          repository: GoCodeAlone/workflow-compute
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          path: workflow-compute
      - name: Verify workflow-compute setup runtime surface
        run: |
          (cd workflow-compute && GOWORK=off go run ./cmd/compute agent setup --help) 2>&1 | tee /tmp/compute-agent-setup-help.txt
          grep -q -- '-runtime' /tmp/compute-agent-setup-help.txt
      - name: Verify projectless agent setup CLI
        run: |
          GOWORK=off go build \
            -ldflags "-s -w -X github.com/GoCodeAlone/workflow-plugin-compute/internal.Version=$(jq -r .version plugin.json)" \
            -o workflow-plugin-compute ./cmd/workflow-plugin-compute
          plugin_dir="$(mktemp -d)"
          trap 'rm -rf "$plugin_dir"' EXIT
          help_output="$(wfctl plugin run --plugin-dir "$plugin_dir/plugins" --ensure-installed --local . workflow-plugin-compute -- compute agent setup --help 2>&1)"
          printf '%s\n' "$help_output"
          dry_run_output="$(wfctl plugin run --plugin-dir "$plugin_dir/plugins" --ensure-installed --local . workflow-plugin-compute -- \
            compute agent setup \
            --server https://compute.example.invalid \
            --invite-url 'https://compute.example.invalid/install?invite_id=ci&redeem_code=ci-redemption-value&access_token=ci-access-value#auth_token=ci-fragment-value' \
            --install-session-id ci-session \
            --runtime managed-containerd \
            --install \
            --verify \
            --dry-run \
            --non-interactive \
            --json 2>&1)"
          printf '%s\n' "$dry_run_output"
          if printf '%s\n' "$dry_run_output" | grep -E 'ci-redemption-value|ci-access-value|ci-fragment-value|redeem_code=ci-redemption-value|access_token=ci-access-value|auth_token=ci-fragment-value'; then
            echo "::error::dry-run output leaked setup secret material"
            exit 1
          fi
          printf '%s\n' "$dry_run_output" | grep -q '"agent_setup_command": "compute agent setup '
          printf '%s\n' "$dry_run_output" | grep -q '"requested_runtime": "managed-containerd"'
          printf '%s\n' "$dry_run_output" | grep -q '"runtime_selection": "auto"'
          printf '%s\n' "$dry_run_output" | grep -q '"plugin": "workflow-plugin-compute-container"'
          printf '%s\n' "$dry_run_output" | grep -q '"minimum_version": "v0.5.0"'
          printf '%s\n' "$dry_run_output" | grep -q '"contract": "ManagedRuntimeBundleInstaller"'
          printf '%s\n' "$dry_run_output" | grep -q '"command_prefix": "wfctl plugin run --ensure-installed workflow-plugin-compute-container@v0.5.0 -- managed-runtime"'
          for lifecycle_action in install doctor uninstall reinstall; do
            printf '%s\n' "$dry_run_output" | grep -q "\"$lifecycle_action\""
          done
          printf '%s\n' "$dry_run_output" | grep -q -- '--runtime auto'
          if printf '%s\n' "$dry_run_output" | grep -q -- '--runtime managed-containerd'; then
            echo "::error::dry-run command rendered a runtime value current workflow-compute rejects"
            exit 1
          fi
          if printf '%s\n' "$dry_run_output" | grep -q '"agent_setup_command": "wfctl plugin run '; then
            echo "::error::dry-run command recursively targets wfctl plugin run"
            exit 1
          fi
          set +e
          timeout_prefix=()
          if command -v timeout >/dev/null 2>&1; then
            timeout_prefix=(timeout 20s)
          fi
          compat_output="$(cd workflow-compute && "${timeout_prefix[@]}" env GOWORK=off go run ./cmd/compute \
            agent setup \
            --server http://127.0.0.1:9 \
            --invite-url 'http://127.0.0.1:9/install?invite_id=ci&redeem_code=ci-redacted' \
            --install-session-id ci-session \
            --runtime auto \
            --install \
            --verify \
            --non-interactive \
            --json 2>&1)"
          compat_status="$?"
          set -e
          printf '%s\n' "$compat_output"
          if [ "$compat_status" -eq 124 ]; then
            echo "::error::workflow-compute setup compatibility probe timed out"
            exit 1
          fi
          if printf '%s\n' "$compat_output" | grep -q -- '--runtime must be'; then
            echo "::error::workflow-compute rejected generated runtime selection"
            exit 1
          fi
      - name: Check workflow-compute provider alignment
        run: scripts/check-workflow-compute-alignment.sh "$GITHUB_WORKSPACE/workflow-compute"
      - name: Validate workflow config
        run: wfctl validate --allow-no-entry-points workflow.yaml
      - name: Build with wfctl
        run: wfctl build --config workflow.yaml --no-push --tag ci
