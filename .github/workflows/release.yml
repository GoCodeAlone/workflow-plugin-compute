name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - name: Verify build compiler
        run: go run ./scripts/check-build-toolchain.go
      - name: Configure private Go modules
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${RELEASES_TOKEN}@github.com/GoCodeAlone/".insteadOf "https://github.com/GoCodeAlone/"
          go env -w GOPRIVATE=github.com/GoCodeAlone/*
      - name: Install wfctl v0.78.2
        run: |
          mkdir -p "${RUNNER_TEMP}/wfctl-bin"
          curl -sSfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o "${RUNNER_TEMP}/wfctl-bin/wfctl" \
            "https://github.com/GoCodeAlone/workflow/releases/download/v0.78.2/wfctl-linux-amd64"
          chmod +x "${RUNNER_TEMP}/wfctl-bin/wfctl"
      - name: Validate plugin contract for publish (pre-build)
        run: "${{ runner.temp }}/wfctl-bin/wfctl plugin validate-contract --for-publish --tag ${{ github.ref_name }} ."
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.20.3
          install-only: true
      - name: Publish with verified GoReleaser
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENGINE_BIN="$(command -v goreleaser)"
          verify_engine() {
            case "$ENGINE_BIN" in /*) ;; *) return 1 ;; esac
            test -f "$ENGINE_BIN" && test ! -L "$ENGINE_BIN" || return 1
            printf '%s  %s\n' 'd124b61b79baf6d7e2727bb018e7115c045c076df82c13795bb19f9ace4b612d' "$ENGINE_BIN" | shasum -a 256 --check --strict
          }
          verify_engine
          "$ENGINE_BIN" release --clean
          # Preserve successful artifact/metadata log groups. Previous unnamed
          # action outputs had no consumers.
          for kind in artifacts metadata; do
            metadata="dist/$kind.json"
            if [ -s "$metadata" ]; then
              content="$(cat "$metadata")"
              if [ "$content" != null ]; then
                label='Metadata output'
                if [ "$kind" = artifacts ]; then label='Artifacts output'; fi
                printf '::group::%s\n' "$label"
                printf '%s\n' "$content"
                echo '::endgroup::'
              fi
            fi
          done
      # workflow#765: runtime truth-check via plugin verify-capabilities.
      - name: Verify capabilities (runtime truth-check)
        if: >-
          !github.event.deleted
          && !contains(github.ref_name, '-')
          && github.repository == 'GoCodeAlone/workflow-plugin-compute'
        run: |
          RUNNER_ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          BIN=$(jq -r --arg arch "$RUNNER_ARCH" \
            '[.[] | select(.type=="Binary" and .goos=="linux" and .goarch==$arch and (.name|startswith("workflow-plugin-compute")))] | .[0].path // ""' \
            dist/artifacts.json)
          if [ -z "$BIN" ] || [ "$BIN" = "null" ]; then
            echo "::warning::No matching linux/$RUNNER_ARCH binary in dist/artifacts.json; skipping verify-capabilities"
            jq '.[] | {name, type, goos, goarch, path}' dist/artifacts.json
            exit 0
          fi
          "${{ runner.temp }}/wfctl-bin/wfctl" plugin verify-capabilities --binary "$BIN" .

  notify-workflow-registry:
    name: Notify workflow-registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release
    if: >-
      !github.event.deleted
      && !contains(github.ref_name, '-')
      && github.repository == 'GoCodeAlone/workflow-plugin-compute'
    steps:
      - name: Trigger registry manifest sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        with:
          token: ${{ secrets.repo_dispatch_token }}
          repository: GoCodeAlone/workflow-registry
          event-type: plugin-release
          client-payload: |-
            {"plugin": "workflow-plugin-compute", "tag": "${{ github.ref_name }}"}
