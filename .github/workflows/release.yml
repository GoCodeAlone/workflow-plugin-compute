name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - name: Verify build compiler
        run: go run ./scripts/check-build-toolchain.go
      - name: Configure private Go modules
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${RELEASES_TOKEN}@github.com/GoCodeAlone/".insteadOf "https://github.com/GoCodeAlone/"
          go env -w GOPRIVATE=github.com/GoCodeAlone/*
      - name: Install authenticated wfctl v0.78.2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          mkdir "${RUNNER_TEMP}/wfctl-bin"
          curl -sSfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o "${RUNNER_TEMP}/wfctl-bin/wfctl" \
            "https://github.com/GoCodeAlone/workflow/releases/download/v0.78.2/wfctl-linux-amd64"
          test -f "${RUNNER_TEMP}/wfctl-bin/wfctl" && test ! -L "${RUNNER_TEMP}/wfctl-bin/wfctl"
          printf '%s  %s\n' '0d41f3050b535e2bc7c1d6a5537ab2a60938e0b49c4c4f12ece1be883762dfc8' "${RUNNER_TEMP}/wfctl-bin/wfctl" | shasum -a 256 --check --strict
          chmod 500 "${RUNNER_TEMP}/wfctl-bin/wfctl"
      - name: Validate plugin contract for publish (pre-build)
        run: "${{ runner.temp }}/wfctl-bin/wfctl plugin validate-contract --for-publish --tag ${{ github.ref_name }} ."
      - name: Acquire authenticated GoReleaser v2.20.3
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          for file in scripts/acquire-release-engine.go scripts/install-release-engine.sh; do
            test -f "$file" && test ! -L "$file"
          done
          shasum -a 256 --check --strict <<'ENGINE_INPUTS'
          3b01467f6689213350af39ec8130eb9fd918531cd981bff4df5387197edd43f1  scripts/acquire-release-engine.go
          9c1ce84cca15098821f4597fcc7fda12a65bcaffce47e31636f43516f51af083  scripts/install-release-engine.sh
          ENGINE_INPUTS
          work="$(mktemp -d "$RUNNER_TEMP/engine-acquire.XXXXXXXX")"
          mkdir "$work/home" "$work/tmp" "$work/cache" "$work/gopath"
          go_bin="$(command -v go)"
          engine_bin="$(env -i PATH="$(dirname "$go_bin"):/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            GOTOOLCHAIN=local GO111MODULE=off GOENV=off GOWORK=off GOTELEMETRY=off \
            GOPROXY=off GOSUMDB=off GOVCS='*:off' GOMAXPROCS=1 GOFLAGS='-p=1' \
            GOCACHE="$work/cache" GOPATH="$work/gopath" \
            "$go_bin" run ./scripts/acquire-release-engine.go "$GITHUB_WORKSPACE" "$RUNNER_TEMP")"
          test -n "$engine_bin"
          printf '%s\n' "$(dirname "$engine_bin")" >> "$GITHUB_PATH"
      - name: Publish with verified GoReleaser
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WFCTL_BIN: ${{ runner.temp }}/wfctl-bin/wfctl
        run: |
          ENGINE_BIN="$(command -v goreleaser)"
          verify_engine() {
            case "$ENGINE_BIN" in /*) ;; *) return 1 ;; esac
            test -f "$ENGINE_BIN" && test ! -L "$ENGINE_BIN" || return 1
            printf '%s  %s\n' 'd124b61b79baf6d7e2727bb018e7115c045c076df82c13795bb19f9ace4b612d' "$ENGINE_BIN" | shasum -a 256 --check --strict
          }
          verify_engine
          "$ENGINE_BIN" release --clean
          # Preserve successful artifact/metadata log groups. Previous unnamed
          # action outputs had no consumers.
          for kind in artifacts metadata; do
            metadata="dist/$kind.json"
            if [ -s "$metadata" ]; then
              content="$(cat "$metadata")"
              if [ "$content" != null ]; then
                label='Metadata output'
                if [ "$kind" = artifacts ]; then label='Artifacts output'; fi
                printf '::group::%s\n' "$label"
                printf '%s\n' "$content"
                echo '::endgroup::'
              fi
            fi
          done
      # Runtime identity/version and declared-IaC validation now runs as the
      # native build post-hook before archives/publishing. Full capability-list
      # parity and cross-platform runtime acceptance are not asserted.

  notify-workflow-registry:
    name: Notify workflow-registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release
    if: >-
      !github.event.deleted
      && !contains(github.ref_name, '-')
      && github.repository == 'GoCodeAlone/workflow-plugin-compute'
    steps:
      - name: Trigger registry manifest sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        with:
          token: ${{ secrets.repo_dispatch_token }}
          repository: GoCodeAlone/workflow-registry
          event-type: plugin-release
          client-payload: |-
            {"plugin": "workflow-plugin-compute", "tag": "${{ github.ref_name }}"}
