name: Archive qualification
on:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  archives:
    # This uses the existing trusted same-repository CI read boundary. Repository
    # location alone is not a sandbox against a malicious workflow author.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.20.3
          install-only: true
      - name: Bind source and immutable inputs before credentials
        id: scratch
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ && "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
          for file in .goreleaser.yaml scripts/check-build-toolchain.go go.mod go.sum scripts/check-release-archives.go scripts/check-release-archives_test.go; do
            test -f "$file" && test ! -L "$file"
          done
          # Update these anchors together only after reviewing the affected bytes.
          sha256sum --check --strict <<'INPUTS'
          ca7391c22eba7e030ad815c194da6c2ab40869a1936c8b2a2790895de3dd9baa  .goreleaser.yaml
          68afa214265e8668c77bdd63db95f60e987d7f7cd82bb3df7d82a25618d4e732  scripts/check-build-toolchain.go
          de865e63ef12058b46d3e1bba849c80213ef2219bcd827b4b8fbdd6b7d363078  go.mod
          97f7baac3309f1b0889b30516fe3dcb581c0ba099130f7904e51d11963f534c4  go.sum
          fdce18cb82d409b7b3f70a0ed8fb8e28124fb3ee17f5783321249d6fbbad5609  scripts/check-release-archives.go
          f725dfd8abea97fd54d066eb4dcccd9a0c635bcc0e6285e28aab5f463872f33f  scripts/check-release-archives_test.go
          INPUTS
          test "$(go version)" = 'go version go1.27.4 linux/amd64'
          ENGINE_BIN="$(command -v goreleaser)"
          verify_engine() {
            case "$ENGINE_BIN" in /*) ;; *) return 1 ;; esac
            test -f "$ENGINE_BIN" && test ! -L "$ENGINE_BIN" || return 1
            printf '%s  %s\n' 'd124b61b79baf6d7e2727bb018e7115c045c076df82c13795bb19f9ace4b612d' "$ENGINE_BIN" | shasum -a 256 --check --strict
          }
          verify_engine
          "$ENGINE_BIN" --version | tee "$RUNNER_TEMP/archive-goreleaser-version.txt"
          grep -Eq '(^|[[:space:]])v?2[.]20[.]3([[:space:]]|$)' "$RUNNER_TEMP/archive-goreleaser-version.txt"
          sha256sum "$(command -v go)" "$ENGINE_BIN"
          printf 'engine_bin=%s\n' "$ENGINE_BIN" >> "$GITHUB_OUTPUT"
          printf 'merge=%s head=%s base=%s tree=%s\n' "$EXPECTED_SHA" "$PR_HEAD" "$PR_BASE" "$(git rev-parse 'HEAD^{tree}')"
          root="$(mktemp -d "$RUNNER_TEMP/archive-qualification.XXXXXXXX")"
          mkdir "$root/module-cache" "$root/build-cache" "$root/gopath" "$root/acquire-tmp"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Acquire pinned dependencies
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          OWNED_ROOT: ${{ steps.scratch.outputs.root }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          umask 077
          auth="$(mktemp -d "$OWNED_ROOT/auth.XXXXXXXX")"
          trap 'rm -f -- "$auth/.gitconfig" "$OWNED_ROOT/acquire.stdout" "$OWNED_ROOT/acquire.stderr"' EXIT
          git config --file "$auth/.gitconfig" url."https://x-access-token:${RELEASES_TOKEN}@github.com/GoCodeAlone/".insteadOf "https://github.com/GoCodeAlone/"
          go_bin="$(command -v go)"
          read_deps() {
            env -i PATH="$(dirname "$go_bin"):/usr/bin:/bin" HOME="$auth" TMPDIR="$OWNED_ROOT/acquire-tmp" \
              GOTOOLCHAIN=local GOENV=off GOWORK=off GOPACKAGESDRIVER=off CGO_ENABLED=0 \
              GOFLAGS='-p=1 -mod=readonly' GOTELEMETRY=off GOMAXPROCS=2 GOMEMLIMIT=768MiB \
              GOPATH="$OWNED_ROOT/gopath" GOMODCACHE="$OWNED_ROOT/module-cache" GOCACHE="$OWNED_ROOT/build-cache" \
              GOPRIVATE='github.com/GoCodeAlone/*' GONOPROXY='github.com/GoCodeAlone/*' GONOSUMDB='github.com/GoCodeAlone/*' \
              GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL="$auth/.gitconfig" GIT_TERMINAL_PROMPT=0 GIT_ALLOW_PROTOCOL=https \
              "$go_bin" "$@"
          }
          # Only pinned tool metadata/resolution: no project programs execute here.
          status=0
          read_deps mod tidy -diff > "$OWNED_ROOT/acquire.stdout" 2> "$OWNED_ROOT/acquire.stderr" || status="$?"
          if [ "$status" -ne 0 ]; then
            echo "::error::pinned dependency tidy failed (exit $status); stopped without fallback; acquisition output withheld"
            exit "$status"
          fi
          status=0
          read_deps list -deps -test ./... > "$OWNED_ROOT/acquire.stdout" 2> "$OWNED_ROOT/acquire.stderr" || status="$?"
          if [ "$status" -ne 0 ]; then
            echo "::error::pinned dependency closure failed (exit $status); stopped without fallback; acquisition output withheld"
            exit "$status"
          fi
          rm -f -- "$auth/.gitconfig"
          test ! -e "$auth/.gitconfig"
          test "$(du -sk "$OWNED_ROOT" | cut -f1)" -lt 4194304
      - name: Qualify archives without credentials
        env:
          OWNED_ROOT: ${{ steps.scratch.outputs.root }}
          EXPECTED_SHA: ${{ github.sha }}
          ENGINE_BIN: ${{ steps.scratch.outputs.engine_bin }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # Actual archives remain on the disposable runner. No upload step.
          sha256sum --check --strict <<'INPUTS'
          ca7391c22eba7e030ad815c194da6c2ab40869a1936c8b2a2790895de3dd9baa  .goreleaser.yaml
          68afa214265e8668c77bdd63db95f60e987d7f7cd82bb3df7d82a25618d4e732  scripts/check-build-toolchain.go
          de865e63ef12058b46d3e1bba849c80213ef2219bcd827b4b8fbdd6b7d363078  go.mod
          97f7baac3309f1b0889b30516fe3dcb581c0ba099130f7904e51d11963f534c4  go.sum
          fdce18cb82d409b7b3f70a0ed8fb8e28124fb3ee17f5783321249d6fbbad5609  scripts/check-release-archives.go
          f725dfd8abea97fd54d066eb4dcccd9a0c635bcc0e6285e28aab5f463872f33f  scripts/check-release-archives_test.go
          INPUTS
          home="$(mktemp -d "$OWNED_ROOT/package-home.XXXXXXXX")"
          tmp="$(mktemp -d "$OWNED_ROOT/package-tmp.XXXXXXXX")"
          tool_path="$(dirname "$(command -v go)"):$(dirname "$ENGINE_BIN"):/usr/bin:/bin"
          clean() {
            env -i PATH="$tool_path" HOME="$home" TMPDIR="$tmp" \
              GOTOOLCHAIN=local GOENV=off GOWORK=off GOAUTH=off GOTELEMETRY=off \
              GOPROXY=off GOVCS='*:off' GOSUMDB=off GOPACKAGESDRIVER=off CGO_ENABLED=0 \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              GOFLAGS='-p=1' GOMAXPROCS=2 GOMEMLIMIT=768MiB \
              GOPATH="$OWNED_ROOT/gopath" GOMODCACHE="$OWNED_ROOT/module-cache" GOCACHE="$OWNED_ROOT/build-cache" "$@"
          }
          verify_engine() {
            case "$ENGINE_BIN" in /*) ;; *) return 1 ;; esac
            test -f "$ENGINE_BIN" && test ! -L "$ENGINE_BIN" || return 1
            printf '%s  %s\n' 'd124b61b79baf6d7e2727bb018e7115c045c076df82c13795bb19f9ace4b612d' "$ENGINE_BIN" | shasum -a 256 --check --strict
          }
          checked_engine() {
            verify_engine || return "$?"
            clean "$ENGINE_BIN" "$@"
          }
          clean go run ./scripts/check-build-toolchain.go
          (cd scripts && clean go test -count=1 -timeout=45s check-release-archives.go check-release-archives_test.go)
          clean go run ./scripts/check-release-archives.go capture "$EXPECTED_SHA" "$OWNED_ROOT/before.json"
          checked_engine check --config=.goreleaser.yaml
          checked_engine release --config=.goreleaser.yaml --snapshot --clean --skip=publish,sign,notarize,sbom,docker,ko --parallelism=1 --timeout=10m
          clean go run ./scripts/check-release-archives.go verify "$EXPECTED_SHA" "$OWNED_ROOT/before.json" "$OWNED_ROOT/extracted"
          clean go run ./scripts/check-build-toolchain.go "$OWNED_ROOT/extracted/linux-amd64/workflow-plugin-compute"
          clean go run ./scripts/check-build-toolchain.go "$OWNED_ROOT/extracted/darwin-arm64/workflow-plugin-compute"
          owned_kib="$(du -sk "$OWNED_ROOT" | cut -f1)"
          dist_kib="$(du -sk dist | cut -f1)"
          test "$((owned_kib + dist_kib))" -lt 4194304
          # This is snapshot/compiler/archive evidence only. Official release
          # still requires authenticated engine bytes and tag-mode qualification.
