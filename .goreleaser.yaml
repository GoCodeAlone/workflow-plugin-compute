version: 2

project_name: workflow-plugin-compute

env:
  - GOTOOLCHAIN=local

before:
  hooks:
    - go run ./scripts/check-build-toolchain.go
    - go mod tidy
    - "sed -i.bak 's/\"version\": \".*\"/\"version\": \"{{ .Version }}\"/' plugin.json"
    - rm -f plugin.json.bak

builds:
  - id: workflow-plugin-compute
    main: ./cmd/workflow-plugin-compute
    binary: workflow-plugin-compute
    hooks:
      post:
        - cmd: 'env GOOS= GOARCH= go run ./scripts/check-build-toolchain.go "{{ .Path }}"'
          output: true
    env:
      - CGO_ENABLED=0
      - GOPRIVATE=github.com/GoCodeAlone/*
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X github.com/GoCodeAlone/workflow-plugin-compute/internal.Version={{.Version}}

archives:
  - id: workflow-plugin-compute
    ids:
      - workflow-plugin-compute
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - plugin.json

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: GoCodeAlone
    name: workflow-plugin-compute
